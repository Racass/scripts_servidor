name: Git credential check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  credential-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree and Git history
        run: python3 .github/scripts/check_git_credentials.py
